name: Rust

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pydantic==2.13.5
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: rustc --edition=2024 --crate-type=lib tests/fixtures/markers/rust/SpecificationMetric.rs --emit=metadata -o /tmp/specmetrics-rust-marker.rmeta
      - run: python tests/python_marker_classvar.py
