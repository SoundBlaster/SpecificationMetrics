name: Rust

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pydantic==2.13.5
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Promptfoo evaluation tools without lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: evals/jev-classification
      - name: Validate Jev evaluation offline
        run: |
          npm run test:offline
          npm run validate
          python3 validate_cases.py
          python3 -m unittest -v test_validate_cases.py
          python3 -m unittest -v test_experiment.py
          python3 -m unittest -v test_context_ablation.py
          python3 -m unittest -v test_score_rustjev.py
          python3 -m unittest -v test_question_grouping.py
          python3 -m unittest -v test_state_key_order.py
          python3 -m unittest -v test_repeat_controls.py
          python3 -m unittest -v test_rubric_alignment.py
          python3 -m unittest -v test_ownership_gate.py
          python3 -m unittest -v test_scanner_build.py
          python3 -m unittest -v test_decision_target_alignment.py
          python3 -m unittest -v test_coreinfra_transport.py test_coreinfra_retry_run.py
          python3 -m unittest -v test_prepare_decision_reference.py
          python3 -m unittest -v test_prepare_context_evidence.py
          python3 prepare_context_evidence.py
          python3 -m unittest -v test_manifest_path_contract_audit.py
          python3 -m unittest -v test_validate_context_annotations.py
          python3 validate_context_annotations.py
          python3 -m unittest -v test_balanced_context_reference.py
          python3 prepare_balanced_context_reference.py
          python3 validate_context_annotations.py --run runs/2026-10-13-balanced-context-reference
          python3 -m unittest -v test_context_reference_v2.py
          python3 prepare_context_reference_v2.py
          python3 validate_context_reference_v2.py
          python3 -m unittest -v test_prepare_bdd_steps_factorial.py
          python3 prepare_bdd_steps_factorial.py
          python3 -m unittest -v test_prepare_bdd_steps_balanced_factorial.py
          python3 prepare_bdd_steps_balanced_factorial.py
          python3 -m unittest -v test_prepare_definition_owner_names.py
          python3 prepare_definition_owner_names.py
          python3 -m unittest -v test_validate_definition_owner_annotations.py
          python3 validate_definition_owner_annotations.py
          python3 -m unittest -v test_manifest_contract_factorial.py
          python3 prepare_manifest_contract_factorial.py
          python3 prepare_manifest_contract_balanced.py
          python3 -m unittest -v test_manifest_contract_balanced.py
          python3 validate_manifest_contract_factorial.py
          python3 -m unittest -v test_manifest_contract_handoff.py
          python3 prepare_manifest_contract_handoff.py
          python3 -m unittest -v test_scope_binding_diagnostic.py
          python3 prepare_scope_binding_diagnostic.py
          python3 -m unittest -v test_scope_binding_v3_1.py
          python3 prepare_scope_binding_v3_1.py
          python3 -m unittest -v test_intent_first_v4.py
          python3 prepare_intent_first_v4.py
          python3 -m unittest -v test_scope_binding_handoff.py
          python3 prepare_scope_binding_handoff.py
          python3 validate_scope_binding_annotations.py
          python3 -m unittest -v test_scope_dispatch_provenance.py
          python3 scope_dispatch_provenance.py --capture runs/2026-10-14-scope-dispatch-provenance-repair-v1 --source-run runs/2026-10-14-scope-binding-v3-1-results-astra-high --verify-repair
          python3 -m unittest -v test_validate_expression_reference.py
          python3 -m unittest -v test_matched_expression_plan.py
          python3 -m unittest -v test_score_matched_expressions.py
          python3 -m unittest -v test_replay_expression_construction.py
          python3 -m unittest -v test_prepare_contrastive_pairs.py
          python3 prepare_contrastive_pairs.py
          python3 -m unittest -v test_validate_contrastive_reference.py
          python3 validate_contrastive_reference.py
          python3 -m unittest -v test_contrastive_decision_study.py test_score_contrastive_decisions.py
          python3 contrastive_decision_study.py
          python3 -m unittest -v test_contrastive_live_replay.py
          python3 -m unittest -v test_choice_mass_warning.py test_contrastive_mass_warning.py
          python3 contrastive_decision_study_v2.py
          python3 -m unittest -v test_contrastive_v2_live_replay.py
          python3 rubric_alignment.py --run runs/2026-10-10-rubric-alignment
          python3 state_key_order.py --run runs/2026-10-09-repeat-controls/round-1
          python3 state_key_order.py --run runs/2026-10-09-repeat-controls/round-2
          python3 state_key_order.py --run runs/2026-10-09-state-key-order
          python3 question_grouping.py --run runs/2026-10-08-question-grouping-persistent --transport persistent
        working-directory: evals/jev-classification
      - run: python -m pip install -r scripts/requirements-metrics.txt
      - run: python scripts/test_classic_metrics.py
      - run: rustc --edition=2024 --crate-type=lib tests/fixtures/markers/rust/SpecificationMetric.rs --emit=metadata -o /tmp/specmetrics-rust-marker.rmeta
      - run: python tests/python_marker_classvar.py

  rustjev-evaluation-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Validate bounded RustJev evaluation driver without inference
        working-directory: evals/jev-classification
        run: |
          cargo fmt --check --manifest-path rust-driver/Cargo.toml
          cargo test --locked --manifest-path rust-driver/Cargo.toml
          cargo clippy --locked --manifest-path rust-driver/Cargo.toml --all-targets -- -D warnings
          cargo run --locked --manifest-path rust-driver/Cargo.toml -- --validate runs/2026-10-08-rustjev-coreinfra/requests.json
